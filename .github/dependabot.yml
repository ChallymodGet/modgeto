# Keeps the SHA-pinned GitHub Actions in .github/workflows up to date.
# Dependabot updates both the pinned commit and the version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
